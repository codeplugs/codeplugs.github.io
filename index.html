  input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px #333038 inset !important;
  -webkit-text-fill-color: #adabc6 !important;
  caret-color: #ffffff !important;
  border: 1px solid #3a3a3a !important;
  transition: background-color 9999s ease-in-out 0s;
}
.form-control {
  background-color: #333038 !important;
  color: #adabc6 !important;
  border: 1px solid #3a3a3a !important;
  border-radius: 8px !important;
}
.form-control::-ms-expand {
background-color: transparent;
border: 0; }
.form-control:focus {
color: #adabc6;
background-color: #333038;
border-color: #333038;
outline: 0;
-webkit-box-shadow: 0 0 0 0.2rem rgba(113, 76, 223, 0.25);
box-shadow: 0 0 0 0.2rem rgba(113, 76, 223, 0.25); }
.form-control::-webkit-input-placeholder {
color: #a19fb9;
opacity: 1; }
.form-control::-moz-placeholder {
color: #a19fb9;
opacity: 1; }
.form-control:-ms-input-placeholder {
color: #a19fb9;
opacity: 1; }
.form-control::-ms-input-placeholder {
color: #a19fb9;
opacity: 1; }
.form-control::placeholder {
color: #a19fb9;
opacity: 1; }
.form-control:disabled, .form-control[readonly] {
background-color: #282a38;
opacity: 1; }

    
  </style>
